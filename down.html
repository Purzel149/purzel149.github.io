<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Berechne präzise Download-Zeiten mit unserem kostenlosen Online-Tool. Live-Berechnung mit Overhead-Simulation und Fertig-Zeit.">
    <meta name="keywords" content="Download Calculator, Download Zeit, Internetgeschwindigkeit, Dateigröße">
    <meta name="author" content="Purzel149">
    <meta name="theme-color" content="#667eea">
    <meta property="og:title" content="Download Time Calculator">
    <meta property="og:description" content="Berechne die exakte Download-Zeit für deine Dateien in Echtzeit.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 630'%3E%3Crect fill='%23667eea' width='1200' height='630'/%3E%3Ctext x='50%25' y='50%25' font-size='72' font-weight='bold' fill='white' text-anchor='middle' dominant-baseline='middle'%3EDownload Calculator%3C/text%3E%3C/svg%3E">
    <title>Download Time Calculator</title>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" defer></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography" defer></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js" defer></script>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <style>
        :root {
            color-scheme: light dark;
        }
        
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #111827;
                color: #f3f4f6;
            }
        }

        .gradient-border {
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1px;
            border-radius: 0.75rem;
        }

        .gradient-border > div {
            background: inherit;
            border-radius: 0.75rem;
            position: relative;
        }

        @media (prefers-color-scheme: dark) {
            .gradient-border > div {
                background-color: #1f2937;
            }
        }

        @media (prefers-color-scheme: light) {
            .gradient-border > div {
                background-color: #ffffff;
            }
        }

        .smooth-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 9999px;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                width: 0;
            }
        }

        input:invalid {
            border-color: #ef4444;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        .input-base {
            flex: 1 !important;
            padding: 0.75rem !important;
            border: 2px solid #e5e7eb !important;
            border-radius: 0.5rem !important;
            font-size: 1rem !important;
            transition: all 0.2s !important;
            background-color: #ffffff !important;
            color: #111827 !important;
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
        }

        .input-base::placeholder {
            color: #9ca3af !important;
        }

        @media (prefers-color-scheme: dark) {
            .input-base {
                background-color: #374151 !important;
                border-color: #4b5563 !important;
                color: #f3f4f6 !important;
            }
            
            .input-base::placeholder {
                color: #9ca3af !important;
            }
        }

        .input-base:focus {
            outline: none !important;
            border-color: #667eea !important;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1) !important;
        }

        .select-base {
            padding: 0.75rem !important;
            border: 2px solid #e5e7eb !important;
            border-radius: 0.5rem !important;
            font-size: 0.95rem !important;
            min-width: 100px !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
            background-color: #ffffff !important;
            color: #111827 !important;
            -webkit-appearance: none !important;
            -moz-appearance: none !important;
            appearance: none !important;
        }

        @media (prefers-color-scheme: dark) {
            .select-base {
                background-color: #374151 !important;
                border-color: #4b5563 !important;
                color: #f3f4f6 !important;
            }
            
            .select-base option {
                background-color: #374151 !important;
                color: #f3f4f6 !important;
            }
        }

        .select-base:focus {
            outline: none !important;
            border-color: #667eea !important;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1) !important;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 32px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #667eea;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(28px);
        }

        @media (prefers-color-scheme: dark) {
            .toggle-slider {
                background-color: #4b5563;
            }
        }

        .preset-btn {
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        @media (prefers-color-scheme: dark) {
            .preset-btn {
                background-color: #374151;
                border-color: #4b5563;
                color: #f3f4f6;
            }
        }

        .preset-btn:hover {
            border-color: #667eea;
            background-color: #f0f4ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        @media (prefers-color-scheme: dark) {
            .preset-btn:hover {
                background-color: #1f2937;
            }
        }

        .result-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border: 2px solid #667eea;
            border-radius: 0.75rem;
            padding: 1.5rem;
        }

        @media (prefers-color-scheme: dark) {
            .result-card {
                background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
                border-color: #764ba2;
            }
        }

        .error-text {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .success-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @media (prefers-color-scheme: dark) {
            .glass-effect {
                background: rgba(31, 41, 55, 0.95);
                border: 1px solid rgba(107, 114, 128, 0.2);
            }
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const PRESETS = [
            { name: "4K Film", size: 20, unit: "GB" },
            { name: "GTA V", size: 110, unit: "GB" },
            { name: "Spotify Song", size: 3, unit: "MB" },
            { name: "HD Film", size: 5, unit: "GB" },
            { name: "Fortnite", size: 90, unit: "GB" },
            { name: "Foto (High Res)", size: 5, unit: "MB" },
        ];

        const FILE_SIZE_UNITS = {
            "B": 1,
            "KB": 1024,
            "MB": 1024 ** 2,
            "GB": 1024 ** 3,
            "TB": 1024 ** 4,
            "PB": 1024 ** 5,
        };

        const SPEED_UNITS = {
            "kbit/s": 1000 / 8,
            "Mbit/s": 1000000 / 8,
            "MB/s": 1024 ** 2,
            "Gbit/s": 1000000000 / 8,
        };

        function formatTime(totalSeconds) {
            if (totalSeconds <= 0 || !isFinite(totalSeconds)) {
                return "Invalid";
            }

            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = Math.round(totalSeconds % 60);

            const parts = [];
            if (hours > 0) parts.push(`${hours}h`);
            if (minutes > 0) parts.push(`${minutes}m`);
            if (seconds > 0 || parts.length === 0) parts.push(`${seconds}s`);

            return parts.join(" ");
        }

        function getFinishTime(totalSeconds) {
            if (totalSeconds <= 0 || !isFinite(totalSeconds)) {
                return "Invalid";
            }

            const now = new Date();
            const finish = new Date(now.getTime() + totalSeconds * 1000);

            const days = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
            const dayName = days[finish.getDay()];
            const time = finish.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

            return `${dayName} um ${time}`;
        }

        function DownloadCalculator() {
            const [fileSize, setFileSize] = useState("");
            const [fileSizeUnit, setFileSizeUnit] = useState("GB");
            const [speed, setSpeed] = useState("");
            const [speedUnit, setSpeedUnit] = useState("Mbit/s");
            const [includeOverhead, setIncludeOverhead] = useState(false);
            const [darkMode, setDarkMode] = useState(false);

            useEffect(() => {
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                setDarkMode(prefersDark);
            }, []);

            const calculation = useMemo(() => {
                const fileSizeNum = parseFloat(fileSize);
                const speedNum = parseFloat(speed);

                if (!fileSizeNum || !speedNum || fileSizeNum <= 0 || speedNum <= 0) {
                    return null;
                }

                const fileSizeBytes = fileSizeNum * (FILE_SIZE_UNITS[fileSizeUnit] || 1);
                let speedBytesPerSec = speedNum * (SPEED_UNITS[speedUnit] || 1);

                if (includeOverhead) {
                    speedBytesPerSec *= 0.9;
                }

                const secondsTotal = fileSizeBytes / speedBytesPerSec;
                const formattedTime = formatTime(secondsTotal);
                const finishTime = getFinishTime(secondsTotal);
                const mbPerSec = speedBytesPerSec / (1024 ** 2);

                return {
                    seconds: secondsTotal,
                    formatted: formattedTime,
                    finishTime,
                    mbPerSec,
                };
            }, [fileSize, fileSizeUnit, speed, speedUnit, includeOverhead]);

            const handlePreset = (preset) => {
                setFileSize(preset.size.toString());
                setFileSizeUnit(preset.unit);
            };

            const progressPercent = useMemo(() => {
                if (!calculation) return 0;
                const maxSeconds = 86400; // 24 hours for scale
                return Math.min((calculation.seconds / maxSeconds) * 100, 100);
            }, [calculation]);

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 p-4 sm:p-6 lg:p-8 transition-colors duration-300">
                    <div className="max-w-2xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8 sm:mb-12">
                            <h1 className="text-4xl sm:text-5xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent mb-2">
                                Download Calculator
                            </h1>
                            <p className="text-gray-600 dark:text-gray-300 text-lg mb-3">
                                Berechne die exakte Download-Zeit in Echtzeit
                            </p>
                            <a 
                                href="/olddown" 
                                className="inline-block px-4 py-2 text-sm font-medium bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-100 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200"
                            >
                                ← Alte Version? Hier entlang
                            </a>
                        </div>

                        {/* Main Card */}
                        <div className="glass-effect rounded-2xl shadow-2xl p-6 sm:p-8 mb-6">
                            {/* Overhead Toggle */}
                            <div className="flex items-center justify-between mb-8 pb-6 border-b border-gray-200 dark:border-gray-700">
                                <div>
                                    <h3 className="font-semibold text-gray-800 dark:text-white mb-1">
                                        Reale Bedingungen
                                    </h3>
                                    <p className="text-sm text-gray-600 dark:text-gray-400">
                                        10% Protokoll-Overhead berücksichtigen
                                    </p>
                                </div>
                                <label className="toggle-switch">
                                    <input
                                        type="checkbox"
                                        checked={includeOverhead}
                                        onChange={(e) => setIncludeOverhead(e.target.checked)}
                                    />
                                    <span className="toggle-slider"></span>
                                </label>
                            </div>

                            {/* Input Group 1: File Size */}
                            <div className="mb-6">
                                <label className="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                                    Dateigröße
                                </label>
                                <div className="input-group">
                                    <input
                                        type="number"
                                        placeholder="z.B. 20"
                                        value={fileSize}
                                        onChange={(e) => setFileSize(e.target.value)}
                                        className="input-base"
                                        min="0"
                                        step="0.1"
                                    />
                                    <select
                                        value={fileSizeUnit}
                                        onChange={(e) => setFileSizeUnit(e.target.value)}
                                        className="select-base"
                                    >
                                        {Object.keys(FILE_SIZE_UNITS).map((unit) => (
                                            <option key={unit} value={unit}>
                                                {unit}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Input Group 2: Speed */}
                            <div className="mb-8">
                                <label className="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-2">
                                    Internetgeschwindigkeit
                                </label>
                                <div className="input-group">
                                    <input
                                        type="number"
                                        placeholder="z.B. 50"
                                        value={speed}
                                        onChange={(e) => setSpeed(e.target.value)}
                                        className="input-base"
                                        min="0"
                                        step="0.1"
                                    />
                                    <select
                                        value={speedUnit}
                                        onChange={(e) => setSpeedUnit(e.target.value)}
                                        className="select-base"
                                    >
                                        {Object.keys(SPEED_UNITS).map((unit) => (
                                            <option key={unit} value={unit}>
                                                {unit}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Presets */}
                            <div className="mb-8">
                                <label className="block text-sm font-semibold text-gray-700 dark:text-gray-200 mb-3">
                                    Schnellwahl
                                </label>
                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    {PRESETS.map((preset, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handlePreset(preset)}
                                            className="preset-btn text-xs sm:text-sm"
                                        >
                                            <span className="block font-medium">{preset.name}</span>
                                            <span className="text-xs opacity-70">
                                                {preset.size}
                                                {preset.unit}
                                            </span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Result */}
                            {calculation ? (
                                <div className="result-card">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                        <div>
                                            <p className="text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">
                                                Download-Zeit
                                            </p>
                                            <p className="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
                                                {calculation.formatted}
                                            </p>
                                        </div>
                                        <div>
                                            <p className="text-sm font-medium text-gray-600 dark:text-gray-300 mb-1">
                                                Fertig am
                                            </p>
                                            <p className="text-lg sm:text-xl font-semibold text-gray-800 dark:text-white">
                                                {calculation.finishTime}
                                            </p>
                                        </div>
                                    </div>

                                    {/* Progress Bar */}
                                    <div className="mt-6 pt-6 border-t border-gray-300 dark:border-gray-600">
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-xs font-medium text-gray-600 dark:text-gray-300">
                                                Geschwindigkeit
                                            </span>
                                            <span className="text-sm font-semibold text-purple-600 dark:text-purple-400">
                                                {calculation.mbPerSec.toFixed(2)} MB/s
                                            </span>
                                        </div>
                                        <div className="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-3 overflow-hidden">
                                            <div
                                                className="progress-fill h-full"
                                                style={{ width: `${progressPercent}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="result-card text-center">
                                    <p className="text-gray-600 dark:text-gray-300">
                                        Gib die Dateigröße und Internetgeschwindigkeit ein, um die Download-Zeit zu berechnen.
                                    </p>
                                </div>
                            )}
                        </div>

                        {/* Footer */}
                        <div className="text-center text-sm text-gray-600 dark:text-gray-400">
                            <p>
                                💡 Tipp: Nutze "Reale Bedingungen" für genauere Vorhersagen
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<DownloadCalculator />, document.getElementById("root"));

        // Service Worker Registration für Offline-Unterstützung
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
const CACHE_NAME = 'download-calc-v1';
const urlsToCache = [
  '/',
  '/down.html',
  'https://unpkg.com/react@18.2.0/umd/react.production.min.js',
  'https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js',
  'https://cdn.tailwindcss.com?plugins=forms,typography',
  'https://unpkg.com/@babel/standalone@7.23.5/babel.min.js'
];

self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME)
      .then(cache => cache.addAll(urlsToCache).catch(() => console.log('Offline-Cache teilweise nicht verfügbar')))
      .then(() => self.skipWaiting())
  );
});

self.addEventListener('activate', event => {
  event.waitUntil(
    caches.keys().then(cacheNames => {
      return Promise.all(
        cacheNames.map(cacheName => {
          if (cacheName !== CACHE_NAME) {
            return caches.delete(cacheName);
          }
        })
      );
    }).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', event => {
  if (event.request.method !== 'GET') return;
  
  event.respondWith(
    caches.match(event.request)
      .then(response => {
        if (response) return response;
        
        return fetch(event.request).then(response => {
          if (!response || response.status !== 200) return response;
          
          const responseToCache = response.clone();
          caches.open(CACHE_NAME)
            .then(cache => cache.put(event.request, responseToCache));
          
          return response;
        });
      })
      .catch(() => {
        // Fallback für offline
        return caches.match(event.request);
      })
  );
});
                `;
                
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl, { scope: '/' })
                    .then(reg => console.log('✅ Service Worker registriert'))
                    .catch(err => console.log('⚠️ Service Worker konnte nicht registriert werden:', err));
            });
        }
    </script>
</body>
</html>
