<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const PRESETS = [
            { name: "4K Film", size: 20, unit: "GB" },
            { name: "GTA V", size: 110, unit: "GB" },
            { name: "Spotify Song", size: 3, unit: "MB" },
            { name: "HD Film", size: 5, unit: "GB" },
            { name: "Fortnite", size: 90, unit: "GB" },
            { name: "Foto (High Res)", size: 5, unit: "MB" },
        ];

        const FILE_SIZE_UNITS = {
            "B": 1,
            "KB": 1024,
            "MB": 1024 ** 2,
            "GB": 1024 ** 3,
            "TB": 1024 ** 4,
            "PB": 1024 ** 5,
        };

        const SPEED_UNITS = {
            "kbit/s": 1000 / 8,
            "Mbit/s": 1000000 / 8,
            "MB/s": 1024 ** 2,
            "Gbit/s": 1000000000 / 8,
        };

        // Neue Overhead-Profile (geschätzte Protokoll-Overheads in Prozent)
        const OVERHEAD_PROFILES = [
            { key: 'none', label: 'Kein Overhead (theoretisch)', percent: 0 },
            { key: 'generic', label: 'Generisch (10%)', percent: 10 },
            { key: 'http', label: 'HTTP (7%)', percent: 7 },
            { key: 'https', label: 'HTTPS/TLS (12%)', percent: 12 },
            { key: 'smb', label: 'SMB/CIFS (20%)', percent: 20 },
            { key: 'ftp', label: 'FTP (8%)', percent: 8 },
            { key: 'sftp', label: 'SFTP/SSH (14%)', percent: 14 },
            { key: 'vpn', label: 'VPN (15%)', percent: 15 },
        ];

        function formatTime(totalSeconds) {
            if (totalSeconds <= 0 || !isFinite(totalSeconds)) {
                return "Invalid";
            }

            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = Math.round(totalSeconds % 60);

            const parts = [];
            if (hours > 0) parts.push(`${hours}h`);
            if (minutes > 0) parts.push(`${minutes}m`);
            if (seconds > 0 || parts.length === 0) parts.push(`${seconds}s`);

            return parts.join(" ");
        }

        function getFinishTime(totalSeconds) {
            if (totalSeconds <= 0 || !isFinite(totalSeconds)) {
                return "Invalid";
            }

            const now = new Date();
            const finish = new Date(now.getTime() + totalSeconds * 1000);

            const days = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
            const dayName = days[finish.getDay()];
            const time = finish.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

            return `${dayName} um ${time}`;
        }

        function DownloadCalculator() {
            const [fileSize, setFileSize] = useState("");
            const [fileSizeUnit, setFileSizeUnit] = useState("GB");
            const [speed, setSpeed] = useState("");
            const [speedUnit, setSpeedUnit] = useState("Mbit/s");
            // Ersetze Toggle durch Dropdown-Profil
            const [overheadProfile, setOverheadProfile] = useState('generic');
            const [darkMode, setDarkMode] = useState(false);
            const [showOverheadInfo, setShowOverheadInfo] = useState(false);

            useEffect(() => {
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                setDarkMode(prefersDark);
            }, []);

            const calculation = useMemo(() => {
                const fileSizeNum = parseFloat(fileSize);
                const speedNum = parseFloat(speed);

                if (!fileSizeNum || !speedNum || fileSizeNum <= 0 || speedNum <= 0) {
                    return null;
                }

                const fileSizeBytes = fileSizeNum * (FILE_SIZE_UNITS[fileSizeUnit] || 1);
                let speedBytesPerSec = speedNum * (SPEED_UNITS[speedUnit] || 1);

                // Overhead anwenden
                const profile = OVERHEAD_PROFILES.find(p => p.key === overheadProfile) || OVERHEAD_PROFILES[0];
                const overheadFactor = 1 - (profile.percent / 100);
                speedBytesPerSec *= overheadFactor;

                const secondsTotal = fileSizeBytes / speedBytesPerSec;
                const formattedTime = formatTime(secondsTotal);
                const finishTime = getFinishTime(secondsTotal);
                const mbPerSec = speedBytesPerSec / (1024 ** 2);

                return {
                    seconds: secondsTotal,
                    formatted: formattedTime,
                    finishTime,
                    mbPerSec,
                    overheadPercent: profile.percent,
                    overheadLabel: profile.label,
                };
            }, [fileSize, fileSizeUnit, speed, speedUnit, overheadProfile]);

            const handlePreset = (preset) => {
                setFileSize(preset.size.toString());
                setFileSizeUnit(preset.unit);
            };

            const progressPercent = useMemo(() => {
                if (!calculation) return 0;
                const maxSeconds = 86400; // 24 hours for scale
                return Math.min((calculation.seconds / maxSeconds) * 100, 100);
            }, [calculation]);

            return (
                <div className="page-wrapper">
                    <div className="container">
                        {/* Header */}
                        <div className="header">
                            <h1 className="page-title">
                                Download Calculator
                            </h1>
                            <p className="page-subtitle">
                                Berechne die exakte Download-Zeit in Echtzeit
                            </p>
                            <a 
                                href="/olddown" 
                                className="old-version-link"
                            >
                                ← Alte Version? Hier entlang
                            </a>
                        </div>

                        {/* Main Card */}
                        <div className="main-card">
                            {/* Overhead Dropdown */}
                            <div className="overhead-section">
                                <div className="overhead-row">
                                    <div className="overhead-left">
                                        <div className="overhead-title-row">
                                            <h3 className="overhead-title">
                                                Reale Bedingungen
                                            </h3>
                                            <button
                                                onClick={() => setShowOverheadInfo(!showOverheadInfo)}
                                                className="info-btn"
                                                aria-label="Info zum Protokoll-Overhead"
                                            >
                                                <svg className="info-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                </svg>
                                            </button>
                                        </div>
                                        <p className="overhead-subtitle">
                                            Protokoll-Overhead berücksichtigen
                                        </p>
                                    </div>
                                    <div className="overhead-select-wrap">
                                        <select
                                            value={overheadProfile}
                                            onChange={(e) => setOverheadProfile(e.target.value)}
                                            className="select-base select-full"
                                            aria-label="Overhead-Profil"
                                        >
                                            {OVERHEAD_PROFILES.map(p => (
                                                <option key={p.key} value={p.key}>{p.label}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                                
                                {/* Info-Box mit Erklärung */}
                                {showOverheadInfo && (
                                    <div className="info-box">
                                        <h4 className="info-box-title">
                                            📡 Was ist Protokoll-Overhead?
                                        </h4>
                                        <p className="info-box-text">
                                            Bei jeder Datenübertragung werden zusätzlich zur eigentlichen Datei auch Verwaltungsinformationen (Header, Prüfsummen, Bestätigungen) übertragen. Dieser "Overhead" reduziert die effektive Geschwindigkeit.
                                        </p>
                                        <div className="info-box-list">
                                            <p>• <strong>HTTP/FTP:</strong> Geringe Overheads (~7-8%) durch einfache Protokolle</p>
                                            <p>• <strong>HTTPS/TLS:</strong> Verschlüsselung erhöht Overhead (~12%)</p>
                                            <p>• <strong>SMB/CIFS:</strong> Netzwerk-Dateisysteme haben höhere Overheads (~20%)</p>
                                            <p>• <strong>VPN/SFTP:</strong> Verschlüsselter Tunnel = mehr Overhead (~14-15%)</p>
                                        </div>
                                    </div>
                                )}
                                
                                {calculation && (
                                    <p className="active-profile">
                                        Aktives Profil: {calculation.overheadLabel} (−{calculation.overheadPercent}% Geschwindigkeit)
                                    </p>
                                )}
                            </div>

                            {/* Input Group 1: File Size */}
                            <div className="input-section">
                                <label className="input-label">
                                    Dateigröße
                                </label>
                                <div className="input-group">
                                    <input
                                        type="number"
                                        placeholder="z.B. 20"
                                        value={fileSize}
                                        onChange={(e) => setFileSize(e.target.value)}
                                        className="input-base"
                                        min="0"
                                        step="0.1"
                                    />
                                    <select
                                        value={fileSizeUnit}
                                        onChange={(e) => setFileSizeUnit(e.target.value)}
                                        className="select-base"
                                    >
                                        {Object.keys(FILE_SIZE_UNITS).map((unit) => (
                                            <option key={unit} value={unit}>
                                                {unit}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Input Group 2: Speed */}
                            <div className="input-section-lg">
                                <label className="input-label">
                                    Internetgeschwindigkeit
                                </label>
                                <div className="input-group">
                                    <input
                                        type="number"
                                        placeholder="z.B. 50"
                                        value={speed}
                                        onChange={(e) => setSpeed(e.target.value)}
                                        className="input-base"
                                        min="0"
                                        step="0.1"
                                    />
                                    <select
                                        value={speedUnit}
                                        onChange={(e) => setSpeedUnit(e.target.value)}
                                        className="select-base"
                                    >
                                        {Object.keys(SPEED_UNITS).map((unit) => (
                                            <option key={unit} value={unit}>
                                                {unit}
                                            </option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {/* Presets */}
                            <div className="input-section-lg">
                                <label className="input-label-lg">
                                    Schnellwahl
                                </label>
                                <div className="presets-grid">
                                    {PRESETS.map((preset, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handlePreset(preset)}
                                            className="preset-btn"
                                        >
                                            <span className="preset-name">{preset.name}</span>
                                            <span className="preset-size">
                                                {preset.size}
                                                {preset.unit}
                                            </span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Result */}
                            {calculation ? (
                                <div className="result-card">
                                    <div className="result-grid">
                                        <div>
                                            <p className="result-label">
                                                Download-Zeit
                                            </p>
                                            <p className="result-time">
                                                {calculation.formatted}
                                            </p>
                                        </div>
                                        <div>
                                            <p className="result-label">
                                                Fertig am
                                            </p>
                                            <p className="finish-value">
                                                {calculation.finishTime}
                                            </p>
                                        </div>
                                    </div>

                                    {/* Progress Bar */}
                                    <div className="progress-section">
                                        <div className="speed-row">
                                            <span className="speed-label">
                                                Geschwindigkeit
                                            </span>
                                            <span className="speed-value">
                                                {calculation.mbPerSec.toFixed(2)} MB/s
                                            </span>
                                        </div>
                                        <div className="progress-bar-bg">
                                            <div
                                                className="progress-fill"
                                                style={{ width: `${progressPercent}%` }}
                                            ></div>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="result-card result-card-centered">
                                    <p className="empty-result-text">
                                        Gib die Dateigröße und Internetgeschwindigkeit ein, um die Download-Zeit zu berechnen.
                                    </p>
                                </div>
                            )}
                        </div>

                        {/* Footer */}
                        <div className="footer">
                            <p>
                                💡 Tipp: Nutze "Reale Bedingungen" für genauere Vorhersagen
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<DownloadCalculator />, document.getElementById("root"));

        // Service Worker Registration für Offline-Unterstützung
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
const CACHE_NAME = 'download-calc-v1';
const urlsToCache = [
  '/',
  '/down.html',
  'https://unpkg.com/react@18.2.0/umd/react.production.min.js',
  'https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js',
  'https://unpkg.com/@babel/standalone@7.23.5/babel.min.js'
];

self.addEventListener('install', event => {
  event.waitUntil(
    caches.open(CACHE_NAME)
      .then(cache => cache.addAll(urlsToCache).catch(() => console.log('Offline-Cache teilweise nicht verfügbar')))
      .then(() => self.skipWaiting())
  );
});

self.addEventListener('activate', event => {
  event.waitUntil(
    caches.keys().then(cacheNames => {
      return Promise.all(
        cacheNames.map(cacheName => {
          if (cacheName !== CACHE_NAME) {
            return caches.delete(cacheName);
          }
        })
      );
    }).then(() => self.clients.claim())
  );
});

self.addEventListener('fetch', event => {
  if (event.request.method !== 'GET') return;
  
  event.respondWith(
    caches.match(event.request)
      .then(response => {
        if (response) return response;
        
        return fetch(event.request).then(response => {
          if (!response || response.status !== 200) return response;
          
          const responseToCache = response.clone();
          caches.open(CACHE_NAME)
            .then(cache => cache.put(event.request, responseToCache));
          
          return response;
        });
      })
      .catch(() => {
        // Fallback für offline
        return caches.match(event.request);
      })
  );
});
                `;
                
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl, { scope: '/' })
                    .then(reg => console.log('Service Worker registriert'))
                    .catch(err => console.log('Service Worker konnte nicht registriert werden:', err));
            });
        }
    </script>
</body>
</html>
